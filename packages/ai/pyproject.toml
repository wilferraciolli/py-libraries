[project]
name = "wiltech-labs-ai"
version = "1.0.1"
description = "AI building blocks for Wiltech FastAPI apps: Workers AI / Groq / Ollama behind one protocol, OpenAI-compatible tool calling over httpx, embeddings, portable vector stores (database, Vectorize, Qdrant), hybrid-search fusion and a tool-calling agent loop."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "Wiliam Ferraciolli" }]
keywords = ["fastapi", "llm", "workers-ai", "groq", "ollama", "embeddings", "vectorize", "qdrant", "rag"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "wiltech-labs-core>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/wilferraciolli/py-libraries/tree/main/packages/ai"
Repository = "https://github.com/wilferraciolli/py-libraries"
Conventions = "https://github.com/wilferraciolli/py-libraries/blob/main/docs/PYTHON_APP_CONVENTIONS.md"

[dependency-groups]
dev = [
    "aiosqlite",
    "pytest",
    "pytest-asyncio",
]

# In the workspace, use the local core; `uv build` drops this, so the
# published wheel depends on wiltech-labs-core from PyPI.
[tool.uv.sources]
wiltech-labs-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", ".pytest_cache"]

[tool.hatch.build.targets.wheel]
packages = ["src/wiltech_labs_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
