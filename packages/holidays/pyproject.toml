[project]
name = "wiltech-labs-holidays"
version = "1.0.0"
description = "Public holidays for Wiltech apps: a locale in (el-CY, en-GB), holidays out in the shape @wiltech-labs/ngx-calendar shows, on the holidays package's calendars."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "Wiliam Ferraciolli" }]
keywords = ["holidays", "public-holidays", "locale", "fastapi", "calendar"]
classifiers = [
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "holidays>=0.80",
    "pydantic>=2.7",
    "wiltech-labs-rest>=1.0.1",
]

[project.optional-dependencies]
# `holidays_router()` only. Apps that compute holidays themselves don't need FastAPI.
router = ["fastapi>=0.110"]

[project.urls]
Homepage = "https://github.com/wilferraciolli/py-libraries/tree/main/packages/holidays"
Repository = "https://github.com/wilferraciolli/py-libraries"
Conventions = "https://github.com/wilferraciolli/py-libraries/blob/main/docs/PYTHON_APP_CONVENTIONS.md"

[dependency-groups]
dev = [
    "fastapi",
    "httpx",
    "pytest",
]

[tool.uv.sources]
wiltech-labs-rest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", ".pytest_cache"]

[tool.hatch.build.targets.wheel]
packages = ["src/wiltech_labs_holidays"]

[tool.pytest.ini_options]
testpaths = ["tests"]
