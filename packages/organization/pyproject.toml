[project]
name = "wiltech-labs-organization"
version = "1.0.0"
description = "An organisation's structure for Wiltech apps: org chart items in the shape @wiltech-labs/ngx-organization draws, and the rules for where organisations, entities, departments and jobs may sit."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "Wiliam Ferraciolli" }]
keywords = ["organization", "org-chart", "departments", "jobs", "fastapi"]
classifiers = [
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "wiltech-labs-rest>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/wilferraciolli/py-libraries/tree/main/packages/organization"
Repository = "https://github.com/wilferraciolli/py-libraries"
Conventions = "https://github.com/wilferraciolli/py-libraries/blob/main/docs/PYTHON_APP_CONVENTIONS.md"

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv.sources]
wiltech-labs-rest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", ".pytest_cache"]

[tool.hatch.build.targets.wheel]
packages = ["src/wiltech_labs_organization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
