[project]
name = "wiltech-labs-auth"
version = "0.1.0"
description = "Authentication and authorization for Wiltech FastAPI apps: Clerk JWT verification, the Caller with saved roles, require_admin / require_owner, service API keys and Clerk webhook verification."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "Wiliam Ferraciolli" }]
keywords = ["fastapi", "clerk", "jwt", "authorization", "api-keys", "cloudflare-workers"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "wiltech-labs-core>=0.1.0",
    "wiltech-labs-rest>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/wilferraciolli/py-libraries/tree/main/packages/auth"
Repository = "https://github.com/wilferraciolli/py-libraries"
Conventions = "https://github.com/wilferraciolli/py-libraries/blob/main/docs/PYTHON_APP_CONVENTIONS.md"

[dependency-groups]
dev = [
    "aiosqlite",
    "pytest",
    "pytest-asyncio",
]

# In the workspace, use the local core; `uv build` drops this, so the
# published wheel depends on wiltech-labs-core from PyPI.
[tool.uv.sources]
wiltech-labs-core = { workspace = true }
wiltech-labs-rest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", ".pytest_cache"]

[tool.hatch.build.targets.wheel]
packages = ["src/wiltech_labs_auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
